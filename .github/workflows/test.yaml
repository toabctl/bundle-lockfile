name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to a pull request replaces its run; every push to main runs to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # the type check and the linter (package.json: development tools only, never needed to run bundle-lockfile)
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: cgr.dev/chainguard/wolfi-base:latest
    name: check (types, lint)
    steps:
      - name: Install tools
        run: apk add --no-cache nodejs-24 npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the development tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: cgr.dev/chainguard/wolfi-base:latest
    strategy:
      fail-fast: false
      matrix:
        # 22: loader-thread ESM hooks; 24 and 26: in-thread ones (26 deprecates module.register)
        # 20: the oldest Node.js rspack 2 runs on (20.19)
        node: [20, 22, 24, 26]
    name: unit (Node ${{ matrix.node }})
    steps:
      - name: Install tools
        run: apk add --no-cache nodejs-${{ matrix.node }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no token in .git/config for the packages' install scripts the matrix runs
      - name: Unit tests
        run: node --test test/unit/*.test.cjs

  # the output format against the tools that read it (test/contract.cjs)
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: cgr.dev/chainguard/wolfi-base:latest
    name: contract (syft, Trivy)
    env:
      BLTEST_REQUIRE_SBOM: '1' # a missing syft or trivy fails the job instead of skipping their checks
    steps:
      - name: Install tools
        run: apk add --no-cache nodejs-24 syft trivy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no token in .git/config for the packages' install scripts the matrix runs
      - name: Tool versions
        run: syft version && trivy --version
      - name: Contract tests
        run: node --test test/contract.cjs

  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Wolfi, so the matrix runs against the same node/npm/yarn/bun/syft/trivy packages the build environments use
    container: cgr.dev/chainguard/wolfi-base:latest
    strategy:
      fail-fast: false
      matrix:
        # the whole matrix on Node 24 and 26 (the current LTS lines with in-thread ESM hooks)
        node: [24, 26]
        # each shard installs and runs its own fixtures (test/lib/shard.cjs); 8 shards per Node version
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: matrix (Node ${{ matrix.node }}, ${{ matrix.shard }}/8)
    env:
      BLTEST_REQUIRE_SBOM: '1'
    steps:
      - name: Install tools
        run: apk add --no-cache nodejs-${{ matrix.node }} npm yarn bun syft trivy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no token in .git/config for the packages' install scripts the matrix runs
      - name: Generate fixtures
        run: node test/gen.cjs "$RUNNER_TEMP/fixtures" --shard=${{ matrix.shard }}/8
      - name: Run matrix
        run: node test/run.cjs "$RUNNER_TEMP/fixtures" --shard=${{ matrix.shard }}/8

  # The Vite, Rollup, Rolldown, nested, SvelteKit, rspack 2 and Rsbuild 2 cases on Wolfi's Node 22 (e.g. GitLab and Coder
  # build with it): its latest, with the in-thread ESM hooks (22.22.3 and later, src/hooks.cjs syncHooksSafe), and 22.22.2,
  # the last with the loader-thread hooks, which older Node.js (20, 22 before 22.22.3, 24 before 24.11.1) uses;
  # wp5-apm: tracing agents next to the hooks
  node22:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: cgr.dev/chainguard/wolfi-base:latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '22~22.22.2']
        shard: [1, 2, 3]
    name: matrix (Node ${{ matrix.node }}, Vite, ${{ matrix.shard }}/3)
    env:
      # the fixtures of the ESM-hooked bundlers (also rspack 2 and Rsbuild 2) and of webpack and rspack 1 under Yarn
      # Plug'n'Play (whose CommonJS modules Node 22 loads without Module._load, see src/hooks.cjs), and their cases
      # (gen.cjs and run.cjs select the same ones)
      # (wp5-tsx: tsx's own loader thread next to bundle-lockfile's)
      FIXTURES: '^(vite|nested|sveltekit|nuxt|rollup|peer-deps|mixed-output|wp5-yarn[34]-pnp|wp5-tsx|wp5-apm|rspack2|rspack-features2|rsbuild2|rspack-copies|rspack1\.7-yarn4-pnp|rspack-federation2|rspack-monaco2|rspack-workspace2|rslib|next16-rspack|next16-app-rspack|canary-(vite|rolldown))'
      BLTEST_REQUIRE_SBOM: '1'
    steps:
      - name: Install tools
        run: apk add --no-cache nodejs-${{ matrix.node }} npm yarn bun syft trivy && node -v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no token in .git/config for the packages' install scripts the matrix runs
      - name: Generate fixtures
        run: node test/gen.cjs "$RUNNER_TEMP/fixtures" --fixtures="$FIXTURES" --shard=${{ matrix.shard }}/3
      - name: Run matrix
        run: node test/run.cjs "$RUNNER_TEMP/fixtures" --fixtures="$FIXTURES" --shard=${{ matrix.shard }}/3

  # Node 20 (its newest; the oldest supported is in test/node-versions.json; module.register, no isInternalThread in its
  # loader thread): a few builds of each kind - webpack 5, Vite 8 and the Rollup and Rolldown APIs (loader-thread
  # hooks), rspack 2
  node20:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: cgr.dev/chainguard/wolfi-base:latest
    name: matrix (Node 20, a few builds)
    env:
      FIXTURES: '^(wp5-npm|vite8-npm|rollup-api|rspack2\.2-npm)$'
      BLTEST_REQUIRE_SBOM: '1'
    steps:
      - name: Install tools
        run: apk add --no-cache nodejs-20 npm yarn bun syft trivy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no token in .git/config for the packages' install scripts the matrix runs
      - name: Generate fixtures
        run: node test/gen.cjs "$RUNNER_TEMP/fixtures" --fixtures="$FIXTURES"
      - name: Run matrix
        run: node test/run.cjs "$RUNNER_TEMP/fixtures" --fixtures="$FIXTURES"

  # the Node.js versions at which the hooks behave differently (test/node-versions.json): those marked "pr" here;
  # node-versions.yaml runs all of them weekly and when the hooks change
  node-versions:
    uses: ./.github/workflows/node-versions.yaml
    with:
      set: pr
