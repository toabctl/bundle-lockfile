name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    container: cgr.dev/chainguard/wolfi-base:latest
    steps:
      - name: Install tools
        run: apk add --no-cache nodejs-24
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit tests
        run: node --test test/unit.cjs

  matrix:
    runs-on: ubuntu-latest
    # Wolfi, so the matrix runs against the same node/npm/yarn/bun/syft packages the build environments use
    container: cgr.dev/chainguard/wolfi-base:latest
    strategy:
      fail-fast: false
      matrix:
        # each shard installs and runs its own fixtures (test/lib/shard.cjs)
        shard: [1, 2, 3, 4, 5, 6]
    name: matrix (${{ matrix.shard }}/${{ strategy.job-total }})
    steps:
      - name: Install tools
        run: apk add --no-cache nodejs-24 npm yarn bun syft
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate fixtures
        run: node test/gen.cjs "$RUNNER_TEMP/fixtures" --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Run matrix
        run: node test/run.cjs "$RUNNER_TEMP/fixtures" --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # Node < 24.12 uses the loader-thread ESM hooks (src/hooks.cjs): the Vite and nested cases on Wolfi's Node 22
  # (e.g. GitLab and Coder build with it)
  node22:
    runs-on: ubuntu-latest
    container: cgr.dev/chainguard/wolfi-base:latest
    name: matrix (Node 22, Vite)
    steps:
      - name: Install tools
        run: apk add --no-cache nodejs-22 npm yarn bun syft
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate fixtures
        run: node test/gen.cjs "$RUNNER_TEMP/fixtures" '^(vite|nested)'
      - name: Run matrix
        run: node test/run.cjs "$RUNNER_TEMP/fixtures" '^(Vite|nested)'
